name: Autopilot tick

# Runs one autopilot pass every 5 minutes (GitHub may delay scheduled runs by a few minutes).
# Repository secrets: AUTOPILOT_URL (e.g. https://www.tradeplay.cloud) and AUTOPILOT_SECRET.
# A manual run can pass a query, e.g. "preview=selector" to score the selector board without acting.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Optional query string (preview=selector scores the board without acting)"
        required: false
        default: ""

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/autopilot/tick
        env:
          URL: ${{ secrets.AUTOPILOT_URL }}
          SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          QUERY: ${{ inputs.query }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "AUTOPILOT_URL / AUTOPILOT_SECRET not set"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" "$URL/api/autopilot/tick${QUERY:+?$QUERY}"
