name: Autopilot tick

# Manual autopilot pass. The schedule runs in Supabase (pg_cron, migration 20261026190000):
# GitHub skipped most 5-minute scheduled slots, so it is no longer the scheduler.
# Repository secrets: AUTOPILOT_URL (e.g. https://www.tradeplay.cloud) and AUTOPILOT_SECRET.
# A manual run can pass a query: "preview=selector" scores the selector board without acting;
# "research=XAUUSD&days=30" replays the edge under the live and relaxed rules.
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "tick, or lab for the strategy lab (query i=XAUUSD&family=a5|a15|session&days=180)"
        required: false
        default: "tick"
      query:
        description: "Optional query string (preview=selector, or research=XAUUSD&days=30&day=2026-10-26)"
        required: false
        default: ""

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Call /api/autopilot/tick
        env:
          URL: ${{ secrets.AUTOPILOT_URL }}
          SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          QUERY: ${{ inputs.query }}
          ENDPOINT: ${{ inputs.endpoint || 'tick' }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "AUTOPILOT_URL / AUTOPILOT_SECRET not set"; exit 0; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $SECRET" "$URL/api/autopilot/$ENDPOINT${QUERY:+?$QUERY}"
