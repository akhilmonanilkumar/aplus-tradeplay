# The whole stack on one droplet: the dashboard (web), the engine (API + venue streams), TimescaleDB
# (tick store) and Caddy (HTTPS for the dashboard and engine domains).
services:
  engine:
    build: { context: ../../.., dockerfile: services/engine/deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@db:5432/ticks
      FYERS_TOKEN_FILE: /data/fyers-token.json
    volumes: [engine-data:/data]
    depends_on: [db]
    expose: ["8787"]
  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      secrets: [webenv]
    restart: unless-stopped
    env_file: web.env
    environment:
      # The dashboard reaches the engine inside the Docker network (still HMAC-signed).
      ENGINE_URL: http://engine:8787
    expose: ["3000"]
    depends_on: [engine]
    mem_limit: 1g
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticks
    volumes:
      - /mnt/ticks/pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { ENGINE_DOMAIN: "${ENGINE_DOMAIN}", APP_DOMAIN: "${APP_DOMAIN:-www.tradeplay.cloud}", APEX_DOMAIN: "${APEX_DOMAIN:-tradeplay.cloud}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]
    depends_on: [engine, web]
secrets:
  webenv:
    file: ./web.env
volumes:
  engine-data:
  caddy-data:
