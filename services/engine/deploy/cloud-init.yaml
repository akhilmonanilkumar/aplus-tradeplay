#cloud-config
# Paste into "User data" when creating the droplet (Ubuntu 24.04, Bangalore BLR1).
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, chrony, ufw, unattended-upgrades]
timezone: UTC
runcmd:
  - systemctl enable --now chrony
  - curl -fsSL https://get.docker.com | sh
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /mnt/ticks/pg
  - dpkg-reconfigure -f noninteractive unattended-upgrades
