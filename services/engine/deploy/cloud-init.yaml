#cloud-config
# Paste into "User data" when creating the droplet (Ubuntu 24.04, Bangalore BLR1).
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, chrony, ufw, unattended-upgrades]
timezone: UTC
runcmd:
  - systemctl enable --now chrony
  - curl -fsSL https://get.docker.com | sh
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /mnt/ticks/pg
  # 2 GB swap: the dashboard build needs headroom next to TimescaleDB.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - dpkg-reconfigure -f noninteractive unattended-upgrades
